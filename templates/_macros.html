{% macro icon(name, class_name='') -%}
<svg class="icon {{ class_name }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'chart' %}<path d="M4 3v17h17M9 16v-5m5 5V6m5 10V9"/>
{% elif name == 'problem' %}<path d="M7 4h12l-7 8 7 8H7M4 4v3m0 10v3"/>
{% elif name == 'people' %}<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m2-15a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 4v2"/>
{% elif name == 'link' %}<path d="m10 13 4-4m-6 7-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m4 0 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/>
{% elif name == 'code' %}<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 20"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'plus' %}<path d="M12 5v14m-7-7h14"/>
{% elif name == 'edit' %}<path d="m15 5 4 4M4 20l5-1L20 8a3 3 0 0 0-4-4L5 15l-1 5Z"/>
{% elif name == 'trash' %}<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>
{% elif name == 'database' %}<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7"/>
{% elif name == 'book' %}<path d="M12 6v15M3 3l9 3 9-3v15l-9 3-9-3V3Z"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/>{% endif %}
</svg>
{%- endmacro %}

{% macro field_error(errors, name) -%}
{% if errors.get(name) %}<span class="field-error" role="alert" id="{{ name }}-error">{{ errors[name] }}</span>{% endif %}
{%- endmacro %}

{% macro empty_state(title, message) -%}
<div class="empty-state">{{ icon('search') }}<h3>{{ title }}</h3><p>{{ message }}</p></div>
{%- endmacro %}
